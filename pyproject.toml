[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapemapsapi"
version = "0.1.0"
description = "Official Python SDK for the ScrapeMapsAPI API: Google Maps places, details and reviews"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ScrapeMapsAPI" }]
keywords = ["google-maps", "places", "reviews", "local-business", "maps", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://scrapemapsapi.com"
Repository = "https://github.com/scrapemapsapi/python-sdk"
Issues = "https://github.com/scrapemapsapi/python-sdk/issues"
Documentation = "https://scrapemapsapi.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapemapsapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B008"]
